<header class="flex flex-col gap-2 mt-10 mb-5">
  <div class="flex gap-2">
    <div class="bg-blue-900 p-2 rounded-[50%]">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-checkbox"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M9 11l3 3l8 -8" />
        <path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9" />
      </svg>
    </div>
    <h1 class="text-5xl font-semibold">Mis tareas</h1>
  </div>

  <section class="flex justify-between mt-2">
    <p class="text-sm font-light">Lista rapida de cosas que debo realizar</p>
    <div class="flex gap-2">
      <span class="bg-[#99efe5] py-1 px-5 text-sm font-light text-[#006f67] rounded-3xl">
        {{ tasksService.nPending() }} pendientes
      </span>
      <span class="bg-blue-900 py-1 px-5 text-sm font-light text-blue-200 rounded-3xl">
        {{ tasksService.nCompleted() }} completadas
      </span>
    </div>
  </section>
</header>
