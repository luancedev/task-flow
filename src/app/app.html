<app-header></app-header>
<main>
  <app-input-new-task></app-input-new-task>

  <section class="flex justify-between items-center mt-6">
    <div class="flex gap-2">
      <a
        routerLink="/all"
        routerLinkActive="!bg-[#99efe5] !border-[#006a63] !text-[#006a63]"
        class="border px-4 py-1 text-sm rounded-full transition-colors cursor-pointer bg-neutral-100 text-neutral-700 hover:bg-neutral-300 border-neutral-300"
      >
        Todas
      </a>

      <a
        routerLink="/pending"
        routerLinkActive="!bg-[#99efe5] !border-[#006a63] !text-[#006a63]"
        class="border px-4 py-1 text-sm rounded-full transition-colors cursor-pointer bg-neutral-100 text-neutral-700 hover:bg-neutral-300 border-neutral-300"
      >
        Pendientes
      </a>

      <a
        routerLink="/completed"
        routerLinkActive="!bg-[#99efe5] !border-[#006a63] !text-[#006a63]"
        class="border px-4 py-1 text-sm rounded-full transition-colors cursor-pointer bg-neutral-100 text-neutral-700 hover:bg-neutral-300 border-neutral-300"
      >
        Completadas
      </a>
    </div>

    <button
      (click)="tasksService.clearTasksComplete()"
      class="text-sm px-2 py-1 rounded-full text-neutral-500 transition-colors cursor-pointer hover:bg-gray-200"
    >
      Limpiar Tareas Completadas
    </button>
  </section>

  <!-- Aquí Angular pinta el componente que corresponda a la URL actual -->
  <router-outlet />
</main>
